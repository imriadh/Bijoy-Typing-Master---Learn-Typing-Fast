name: Build Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x

    - name: Install MAUI
      run: |
        dotnet nuget add source https://api.nuget.org/v3/index.json -n nuget.org
        dotnet workload install maui --from-rollback-file https://aka.ms/dotnet/maui/8.0.1xx.json --source https://api.nuget.org/v3/index.json
      continue-on-error: false

    - name: Restore
      run: dotnet restore BijoyTypingMaster/BijoyTypingMaster.csproj
      
    - name: Build
      run: dotnet build BijoyTypingMaster/BijoyTypingMaster.csproj -c Release -f net6.0-windows10.0.19041.0 --no-restore

    - name: Publish
      run: dotnet publish BijoyTypingMaster/BijoyTypingMaster.csproj -c Release -f net6.0-windows10.0.19041.0 -r win10-x64 --self-contained -o publish

    - name: Create Instructions
      run: |
        echo "Bijoy Typing Master - Portable Edition" > publish/README.txt
        echo "" >> publish/README.txt
        echo "SETUP:" >> publish/README.txt
        echo "1. Download SutonnyMJ.ttf from: https://www.omicronlab.com/download/fonts/SutonnyMJ.ttf" >> publish/README.txt
        echo "2. Copy font to: Resources\Fonts\SutonnyMJ.ttf" >> publish/README.txt
        echo "3. Run: BijoyTypingMaster.exe" >> publish/README.txt

    - name: Package
      run: Compress-Archive -Path publish\* -DestinationPath BijoyTypingMaster.zip

    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: BijoyTypingMaster-Windows
        path: BijoyTypingMaster.zip
