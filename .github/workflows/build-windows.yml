name: Build Windows App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 6
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install MAUI workload
      run: |
        dotnet workload install maui-windows --source https://api.nuget.org/v3/index.json
        dotnet workload install maui --source https://api.nuget.org/v3/index.json

    - name: Restore dependencies
      run: dotnet restore BijoyTypingMaster/BijoyTypingMaster.csproj --verbosity detailed

    - name: Build Windows App
      run: |
        dotnet build BijoyTypingMaster/BijoyTypingMaster.csproj `
          -f net6.0-windows10.0.19041.0 `
          -c Release `
          --no-restore `
          --verbosity detailed

    - name: Publish Self-Contained Windows App
      run: |
        dotnet publish BijoyTypingMaster/BijoyTypingMaster.csproj `
          -f net6.0-windows10.0.19041.0 `
          -c Release `
          -r win10-x64 `
          --self-contained true `
          -p:PublishSingleFile=false `
          -p:PublishTrimmed=false `
          --no-restore `
          -o ./publish

    - name: Create Portable Package with Instructions
      run: |
        # Create README for users
        @"
        ╔══════════════════════════════════════════════════════════════╗
        ║  Bijoy Typing Master - Portable Edition                     ║
        ║  No Installation Required!                                   ║
        ╚══════════════════════════════════════════════════════════════╝

        📥 QUICK START (3 Steps):

        1. DOWNLOAD FONT (Required for Bangla text):
           https://www.omicronlab.com/download/fonts/SutonnyMJ.ttf

        2. COPY FONT to this folder:
           Resources\Fonts\SutonnyMJ.ttf

        3. RUN THE APP:
           Double-click: BijoyTypingMaster.exe

        ✅ No .NET installation needed - everything is included!
        ✅ No admin rights required
        ✅ Fully portable - works from USB drive

        📊 SYSTEM REQUIREMENTS:
        - Windows 10 (1809+) or Windows 11
        - 200 MB free space
        - No other software needed!

        🎮 FEATURES:
        - Phase 1: 6 core typing features (100%)
        - Phase 2: 5 gamification features (71%)
        - XP & Leveling System (50 levels)
        - 26 Achievements to unlock
        - Daily Challenges with streaks
        - Custom text practice
        - Speed tests with certificates

        ⚙️ DATABASE:
        All your progress saves to:
        %LOCALAPPDATA%\BijoyTypingMaster\BijoyTypingMaster.db

        To reset progress, delete that database file.

        🆘 TROUBLESHOOTING:
        - Bangla shows as □□□ → Missing SutonnyMJ.ttf font
        - Won't start → Run as Administrator once
        - Blocked by Windows → Right-click .exe → Properties → Unblock

        📧 SUPPORT: https://github.com/imriadh/Bijoy-Typing-Master---Learn-Typing-Fast

        Generated: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')
        Build: Self-Contained Portable Edition
        "@ | Out-File -FilePath ./publish/README.txt -Encoding UTF8

    - name: Create ZIP Package
      run: |
        cd publish
        Compress-Archive -Path * -DestinationPath ../BijoyTypingMaster-Portable.zip

    - name: Upload Portable Package
      uses: actions/upload-artifact@v4
      with:
        name: BijoyTypingMaster-Portable-NoInstall
        path: BijoyTypingMaster-Portable.zip
        retention-days: 90
